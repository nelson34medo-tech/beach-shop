<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Boutique - Catálogo e Inventario</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-full flex flex-col font-sans pb-16">

  <!-- HEADER DE NAVEGACIÓN -->
  <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-700 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-shirt text-sm"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-sm text-gray-900 dark:text-white leading-none">Mi Boutique</h1>
          <span id="header-mode-badge" class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-brand-100 text-brand-600 font-semibold">Catálogo Público</span>
        </div>
      </div>
      
      <!-- BOTÓN DE CAMBIO DE MODO -->
      <button onclick="requestAdminAccess()" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 transition-colors flex items-center space-x-1">
        <i class="fa-solid fa-user-lock text-brand-500"></i>
        <span id="mode-btn-text">Modo Admin</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 max-w-6xl mx-auto w-full p-4 md:p-6">
    
    <!-- VISTA 1: CATÁLOGO PÚBLICO -->
    <div id="view-public" class="space-y-6">
      <!-- Buscador y Filtros -->
      <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
        <div class="relative w-full md:w-80">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
          <input type="text" id="public-search" oninput="renderPublicCatalog()" placeholder="Buscar prendas..." class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl pl-9 pr-4 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm">
        </div>

        <!-- Filtros de Categorías -->
        <div id="category-pills" class="flex space-x-2 overflow-x-auto w-full md:w-auto pb-1 no-scrollbar">
          <!-- Generado dinámicamente -->
        </div>
      </div>

      <!-- Grilla de Productos -->
      <div id="public-catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <!-- Productos generados por JavaScript -->
      </div>
    </div>

    <!-- VISTA 2: PANEL ADMINISTRADOR -->
    <div id="view-admin" class="hidden space-y-4">
      <!-- Pestañas internas de Admin -->
      <div class="flex bg-gray-200 dark:bg-gray-800 p-1 rounded-xl text-xs max-w-md mx-auto">
        <button id="tab-btn-stock" onclick="switchAdminTab('stock')" class="flex-1 py-1.5 rounded-lg text-center bg-white dark:bg-gray-700 font-semibold shadow-sm">
          <i class="fa-solid fa-boxes-stacked mr-1"></i> Stock / Ajuste
        </button>
        <button id="tab-btn-add" onclick="switchAdminTab('add')" class="flex-1 py-1.5 rounded-lg text-center text-gray-500 dark:text-gray-400">
          <i class="fa-solid fa-plus-circle mr-1"></i> Nuevo Producto
        </button>
      </div>

      <!-- Pestaña 1: Inventario -->
      <div id="admin-tab-stock" class="space-y-4 max-w-4xl mx-auto">
        <!-- Métricas Rápidas -->
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 text-center">
            <span class="text-xs text-gray-400 font-medium block uppercase">Total Prendas</span>
            <span id="stat-total-items" class="text-2xl font-extrabold text-brand-600 dark:text-brand-400">0</span>
          </div>
          <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 text-center">
            <span class="text-xs text-gray-400 font-medium block uppercase">Sin Stock</span>
            <span id="stat-out-stock" class="text-2xl font-extrabold text-red-500">0</span>
          </div>
        </div>

        <!-- Lista de Inventario -->
        <div id="admin-inventory-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <!-- Items generados por JS -->
        </div>
      </div>

      <!-- Pestaña 2: Agregar / Editar Producto -->
      <div id="admin-tab-add" class="hidden max-w-lg mx-auto bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 space-y-4 shadow-sm">
        <h3 id="form-title" class="font-bold text-xs uppercase tracking-wider text-gray-500">Agregar Nueva Prenda</h3>
        
        <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-3">
          <input type="hidden" id="form-product-id">

          <div>
            <label class="block text-[10px] font-semibold text-gray-500 mb-1">Nombre de la Prenda</label>
            <input type="text" id="form-name" required class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-brand-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-semibold text-gray-500 mb-1">Categoría</label>
              <select id="form-category" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-brand-500">
                <option value="Vestidos">Vestidos</option>
                <option value="Blusas/Tops">Blusas/Tops</option>
                <option value="Pantalones">Pantalones</option>
                <option value="Calzado">Calzado</option>
                <option value="Accesorios">Accesorios</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-gray-500 mb-1">Precio ($)</label>
              <input type="number" step="0.01" id="form-price" required class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-brand-500">
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-semibold text-gray-500 mb-1">Colores (separados por coma)</label>
            <input type="text" id="form-colors" placeholder="Ej: Rosado, Blanco, Negro" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-brand-500">
          </div>

          <div>
            <label class="block text-[10px] font-semibold text-gray-500 mb-1">Stock por Tallas</label>
            <div class="grid grid-cols-3 gap-2">
              <div><span class="text-[9px] text-gray-400 uppercase">XS:</span> <input type="number" id="size-xs" value="0" min="0" class="w-full bg-gray-50 dark:bg-gray-900 border rounded-lg p-1 text-xs text-center"></div>
              <div><span class="text-[9px] text-gray-400 uppercase">S:</span> <input type="number" id="size-s" value="0" min="0" class="w-full bg-gray-50 dark:bg-gray-900 border rounded-lg p-1 text-xs text-center"></div>
              <div><span class="text-[9px] text-gray-400 uppercase">M:</span> <input type="number" id="size-m" value="0" min="0" class="w-full bg-gray-50 dark:bg-gray-900 border rounded-lg p-1 text-xs text-center"></div>
              <div><span class="text-[9px] text-gray-400 uppercase">L:</span> <input type="number" id="size-l" value="0" min="0" class="w-full bg-gray-50 dark:bg-gray-900 border rounded-lg p-1 text-xs text-center"></div>
              <div><span class="text-[9px] text-gray-400 uppercase">XL:</span> <input type="number" id="size-xl" value="0" min="0" class="w-full bg-gray-50 dark:bg-gray-900 border rounded-lg p-1 text-xs text-center"></div>
              <div><span class="text-[9px] text-gray-400 uppercase">Única:</span> <input type="number" id="size-unique" value="0" min="0" class="w-full bg-gray-50 dark:bg-gray-900 border rounded-lg p-1 text-xs text-center"></div>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-semibold text-gray-500 mb-1">Foto del Producto</label>
            <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
            <div id="image-preview" class="mt-2 hidden">
              <img id="preview-img-src" class="w-16 h-16 object-cover rounded-xl border border-gray-200">
            </div>
          </div>

          <div class="flex space-x-2 pt-2">
            <button type="submit" class="flex-1 bg-brand-500 hover:bg-brand-600 text-white py-2 rounded-xl text-xs font-bold transition-all shadow-md">Guardar Prenda</button>
            <button type="button" onclick="resetForm()" class="px-3 bg-gray-100 dark:bg-gray-700 text-gray-500 rounded-xl text-xs font-semibold">Limpiar</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <!-- BARRA NAVEGACIÓN INFERIOR (MÓVIL) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border-t border-gray-100 dark:border-gray-700 z-30 md:hidden">
    <div class="max-w-md mx-auto flex justify-around py-2">
      <button id="nav-btn-public" onclick="setMode('public')" class="flex flex-col items-center space-y-0.5 text-brand-500">
        <i class="fa-solid fa-store text-base"></i>
        <span class="text-[9px] font-medium">Catálogo</span>
      </button>
      <button id="nav-btn-admin" onclick="requestAdminAccess()" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
        <i class="fa-solid fa-layer-group text-base"></i>
        <span class="text-[9px] font-medium">Inventario</span>
      </button>
    </div>
  </nav>

  <!-- MODAL: DETALLES DE PRODUCTO -->
  <div id="product-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 hidden p-0 sm:p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
      <div class="relative h-64 bg-gray-100 dark:bg-gray-900">
        <img id="modal-img" src="" class="w-full h-full object-cover">
        <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 bg-black/40 text-white rounded-full flex items-center justify-center backdrop-blur-md">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div class="p-4 space-y-3 flex-1 overflow-y-auto">
        <div>
          <span id="modal-category" class="text-[10px] font-bold uppercase tracking-wider text-brand-500">Categoría</span>
          <h2 id="modal-title" class="text-base font-extrabold text-gray-800 dark:text-gray-100">Nombre del Producto</h2>
          <span id="modal-price" class="text-lg font-black text-gray-900 dark:text-white">$0.00</span>
        </div>

        <div>
          <span class="text-[10px] font-semibold text-gray-400 block mb-1">Colores disponibles:</span>
          <div id="modal-colors" class="flex flex-wrap gap-1"></div>
        </div>

        <div>
          <span class="text-[10px] font-semibold text-gray-400 block mb-1">Stock disponible por Talla:</span>
          <div id="modal-sizes" class="grid grid-cols-3 gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: CONTRASEÑA ADMIN -->
  <div id="password-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
    <div class="bg-white dark:bg-gray-800 w-full max-w-xs rounded-2xl p-4 shadow-2xl space-y-3 text-center">
      <div class="w-10 h-10 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto">
        <i class="fa-solid fa-lock text-sm"></i>
      </div>
      <h3 class="font-bold text-sm text-gray-800 dark:text-gray-100">Acceso Administrador</h3>
      <p class="text-[10px] text-gray-400">Ingresa la clave para gestionar inventario</p>

      <form onsubmit="verifyAdminPassword(event)" class="space-y-2">
        <input type="password" id="admin-password-input" placeholder="Contraseña..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-1.5 text-xs text-center focus:outline-none focus:ring-1 focus:ring-brand-500">
        <div class="flex space-x-2">
          <button type="submit" class="flex-1 bg-brand-500 text-white py-1.5 rounded-xl text-xs font-bold">Acceder</button>
          <button type="button" onclick="closePasswordModal()" class="px-3 bg-gray-100 dark:bg-gray-700 text-gray-500 rounded-xl text-xs font-semibold">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICACIONES -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-lg backdrop-blur-md opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    <span id="toast-msg">Mensaje</span>
  </div>

  <!-- JAVASCRIPT DE LA APLICACIÓN -->
  <script>
    let products = [];
    let currentMode = 'public';
    let currentCategoryFilter = 'Todos';
    let base64ImageTemp = '';
    let isAdminAuthenticated = false;

    // Servidor global kvdb/api para almacenar sincronización libre de CORS
    const API_URL = 'https://kvdb.io/4L4Qv7TjC1K77kH6Y7Lq8m/beach_shop_items';

    const defaultProducts = [
      {
        id: "prod-1",
        name: "Vestido Midi Floreado",
        category: "Vestidos",
        price: 28.50,
        colors: ["Rosado", "Blanco"],
        sizes: { XS: 0, S: 3, M: 5, L: 2, XL: 0, Unique: 0 },
        image: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: "prod-2",
        name: "Blusa Satinada Elegante",
        category: "Blusas/Tops",
        price: 18.00,
        colors: ["Champagne", "Negro"],
        sizes: { XS: 1, S: 4, M: 2, L: 0, XL: 0, Unique: 0 },
        image: "https://images.unsplash.com/photo-1564257631407-4deb1f99d992?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: "prod-3",
        name: "Jeans Mom Fit Tiro Alto",
        category: "Pantalones",
        price: 32.00,
        colors: ["Azul Claro", "Azul Oscuro"],
        sizes: { XS: 2, S: 6, M: 4, L: 3, XL: 1, Unique: 0 },
        image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500&auto=format&fit=crop&q=60"
      }
    ];

    // Cargar productos al iniciar (Respaldo Local + Servidor Nube)
    async function loadProducts() {
      // Cargar Local Storage primero para renderizado instantáneo
      const saved = localStorage.getItem('boutique_products_v2');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            products = parsed;
          } else {
            products = [...defaultProducts];
          }
        } catch(e) {
          products = [...defaultProducts];
        }
      } else {
        products = [...defaultProducts];
      }
      refreshUI();

      // Sincronizar desde la nube
      try {
        const res = await fetch(API_URL);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            products = data;
            localStorage.setItem('boutique_products_v2', JSON.stringify(products));
            refreshUI();
          }
        }
      } catch(e) {
        console.log("Servidor local activo");
      }
    }

    async function saveProductsToLocalStorage() {
      localStorage.setItem('boutique_products_v2', JSON.stringify(products));
      refreshUI();
      showToast("Guardando...");

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(products)
        });
        showToast("¡Sincronizado globalmente!");
      } catch(err) {
        showToast("Guardado localmente");
      }
    }

    // Polling constante para sincronizar cambios de otros navegadores cada 4 segundos
    setInterval(async () => {
      try {
        const res = await fetch(API_URL);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            const remoteStr = JSON.stringify(data);
            const localStr = JSON.stringify(products);
            if (remoteStr !== localStr) {
              products = data;
              localStorage.setItem('boutique_products_v2', remoteStr);
              refreshUI();
            }
          }
        }
      } catch(e){}
    }, 4000);

    function refreshUI() {
      renderCategoryPills();
      renderPublicCatalog();
      renderAdminInventory();
    }

    // NAVEGACIÓN Y CONTRASEÑA ADMIN
    window.requestAdminAccess = function() {
      if (currentMode === 'admin') {
        setMode('public');
        isAdminAuthenticated = false;
        return;
      }
      
      if (isAdminAuthenticated) {
        setMode('admin');
      } else {
        document.getElementById('password-modal').classList.remove('hidden');
        document.getElementById('admin-password-input').value = '';
        document.getElementById('admin-password-input').focus();
      }
    };

    window.closePasswordModal = function() {
      document.getElementById('password-modal').classList.add('hidden');
    };

    window.verifyAdminPassword = function(e) {
      e.preventDefault();
      const pass = document.getElementById('admin-password-input').value;
      if (pass === 'gomara22') {
        isAdminAuthenticated = true;
        closePasswordModal();
        setMode('admin');
        showToast("Bienvenido Administrador");
      } else {
        showToast("Contraseña incorrecta");
        document.getElementById('admin-password-input').value = '';
      }
    };

    window.setMode = function(mode) {
      currentMode = mode;
      const viewPublic = document.getElementById('view-public');
      const viewAdmin = document.getElementById('view-admin');
      const btnPublic = document.getElementById('nav-btn-public');
      const btnAdmin = document.getElementById('nav-btn-admin');
      const modeBtnText = document.getElementById('mode-btn-text');

      if (viewPublic && viewAdmin) {
        if (mode === 'public') {
          viewPublic.classList.remove('hidden');
          viewAdmin.classList.add('hidden');

          if (btnPublic) btnPublic.className = "flex flex-col items-center space-y-0.5 text-brand-500";
          if (btnAdmin) btnAdmin.className = "flex flex-col items-center space-y-0.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200";
          if (modeBtnText) modeBtnText.textContent = "Modo Admin";
        } else {
          viewPublic.classList.add('hidden');
          viewAdmin.classList.remove('hidden');

          if (btnAdmin) btnAdmin.className = "flex flex-col items-center space-y-0.5 text-brand-500";
          if (btnPublic) btnPublic.className = "flex flex-col items-center space-y-0.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200";
          if (modeBtnText) modeBtnText.textContent = "Ver Catálogo";
        }
      }
      updateHeaderBadges();
    };

    function updateHeaderBadges() {
      const badge = document.getElementById('header-mode-badge');
      if (badge) {
        if (currentMode === 'public') {
          badge.textContent = "Catálogo Público";
          badge.className = "text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-brand-100 text-brand-600 dark:bg-brand-900/50 dark:text-brand-300 font-semibold";
        } else {
          badge.textContent = "Administración";
          badge.className = "text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300 font-semibold";
        }
      }
    }

    // CATÁLOGO PÚBLICO
    window.renderCategoryPills = function() {
      const container = document.getElementById('category-pills');
      if (!container) return;
      const categories = ["Todos", "Vestidos", "Blusas/Tops", "Pantalones", "Calzado", "Accesorios"];
      
      container.innerHTML = categories.map(cat => {
        const isActive = currentCategoryFilter === cat;
        const activeClass = isActive 
          ? 'bg-brand-500 text-white shadow-sm' 
          : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-gray-50';
        return `
          <button onclick="filterCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${activeClass}">
            ${cat}
          </button>
        `;
      }).join('');
    };

    window.filterCategory = function(cat) {
      currentCategoryFilter = cat;
      renderCategoryPills();
      renderPublicCatalog();
    };

    window.renderPublicCatalog = function() {
      const grid = document.getElementById('public-catalog-grid');
      if (!grid) return;
      const search = (document.getElementById('public-search')?.value || '').toLowerCase();

      const filtered = products.filter(p => {
        const matchCat = currentCategoryFilter === 'Todos' || p.category === currentCategoryFilter;
        const matchSearch = p.name.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-4 text-center py-8 text-gray-400">
            <i class="fa-solid fa-shirt text-3xl mb-2 opacity-50"></i>
            <p class="text-xs">No se encontraron prendas disponibles.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const totalStock = Object.values(p.sizes || {}).reduce((a, b) => a + b, 0);
        const inStock = totalStock > 0;
        return `
          <div onclick="openProductModal('${p.id}')" class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col cursor-pointer hover:shadow-md transition-all active:scale-98">
            <div class="relative h-40 bg-gray-100 dark:bg-gray-900 overflow-hidden">
              <img src="${p.image}" class="w-full h-full object-cover">
              ${!inStock ? '<span class="absolute top-2 right-2 bg-red-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase">Agotado</span>' : ''}
            </div>
            <div class="p-3 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-[9px] font-semibold text-brand-500 uppercase">${p.category}</span>
                <h3 class="font-bold text-xs text-gray-800 dark:text-gray-100 line-clamp-1">${p.name}</h3>
              </div>
              <div class="mt-2 flex items-center justify-between">
                <span class="font-extrabold text-sm text-gray-900 dark:text-white">$${(p.price || 0).toFixed(2)}</span>
                <span class="text-[10px] text-gray-400">${totalStock} disp.</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    };

    // MODAL DETALLES
    window.openProductModal = function(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      document.getElementById('modal-img').src = p.image;
      document.getElementById('modal-category').textContent = p.category;
      document.getElementById('modal-title').textContent = p.name;
      document.getElementById('modal-price').textContent = `$${(p.price || 0).toFixed(2)}`;

      const colorsDiv = document.getElementById('modal-colors');
      colorsDiv.innerHTML = (p.colors || []).map(c => `
        <span class="px-2 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded text-[10px] font-medium">${c}</span>
      `).join('');

      const sizesDiv = document.getElementById('modal-sizes');
      sizesDiv.innerHTML = Object.entries(p.sizes || {}).map(([size, count]) => `
        <div class="p-2 rounded-xl text-center border ${count > 0 ? 'border-brand-200 bg-brand-50/50 dark:bg-brand-900/20 text-brand-700 dark:text-brand-300' : 'border-gray-200 bg-gray-50 text-gray-400 opacity-50'}">
          <span class="block text-[10px] font-bold uppercase">${size}</span>
          <span class="text-xs font-semibold">${count > 0 ? count + ' und' : 'Sin stock'}</span>
        </div>
      `).join('');

      document.getElementById('product-modal').classList.remove('hidden');
    };

    window.closeModal = function() {
      document.getElementById('product-modal').classList.add('hidden');
    };

    // MODO ADMINISTRADOR
    window.switchAdminTab = function(tab) {
      const tabStock = document.getElementById('admin-tab-stock');
      const tabAdd = document.getElementById('admin-tab-add');
      const btnStock = document.getElementById('tab-btn-stock');
      const btnAdd = document.getElementById('tab-btn-add');

      if (tab === 'stock') {
        tabStock.classList.remove('hidden');
        tabAdd.classList.add('hidden');
        btnStock.className = "flex-1 py-1.5 rounded-lg text-center bg-white dark:bg-gray-700 font-semibold shadow-sm";
        btnAdd.className = "flex-1 py-1.5 rounded-lg text-center text-gray-500 dark:text-gray-400";
      } else {
        tabStock.classList.add('hidden');
        tabAdd.classList.remove('hidden');
        btnAdd.className = "flex-1 py-1.5 rounded-lg text-center bg-white dark:bg-gray-700 font-semibold shadow-sm";
        btnStock.className = "flex-1 py-1.5 rounded-lg text-center text-gray-500 dark:text-gray-400";
      }
    };

    window.renderAdminInventory = function() {
      const list = document.getElementById('admin-inventory-list');
      if (!list) return;

      let totalItemsCount = 0;
      let outOfStockCount = 0;

      list.innerHTML = products.map(p => {
        const totalStock = Object.values(p.sizes || {}).reduce((a, b) => a + b, 0);
        totalItemsCount += totalStock;
        if (totalStock === 0) outOfStockCount++;

        return `
          <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
            <div class="flex items-center space-x-3">
              <img src="${p.image}" class="w-12 h-12 object-cover rounded-xl border border-gray-200">
              <div class="flex-1">
                <h4 class="font-bold text-xs text-gray-800 dark:text-gray-100">${p.name}</h4>
                <div class="flex items-center space-x-2 text-[10px] text-gray-400">
                  <span>${p.category}</span>
                  <span>•</span>
                  <span class="font-semibold text-gray-700 dark:text-gray-300">$${(p.price || 0).toFixed(2)}</span>
                </div>
              </div>
              <div class="flex items-center space-x-1">
                <button onclick="editProduct('${p.id}')" class="p-2 text-gray-400 hover:text-brand-500"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteProduct('${p.id}')" class="p-2 text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>

            <!-- Botones Rápidos de Stock por Talla -->
            <div class="grid grid-cols-6 gap-1 pt-2 border-t border-gray-100 dark:border-gray-700/50 text-[10px]">
              ${Object.entries(p.sizes || {}).map(([sz, qty]) => `
                <div class="flex flex-col items-center bg-gray-50 dark:bg-gray-900/50 p-1 rounded-lg">
                  <span class="font-bold text-gray-400 uppercase">${sz}</span>
                  <span class="font-extrabold text-gray-800 dark:text-gray-200 my-0.5">${qty}</span>
                  <div class="flex space-x-1">
                    <button onclick="updateStock('${p.id}', '${sz}', -1)" class="w-4 h-4 rounded bg-gray-200 dark:bg-gray-700 flex items-center justify-center font-bold text-xs hover:bg-red-200 hover:text-red-700">-</button>
                    <button onclick="updateStock('${p.id}', '${sz}', 1)" class="w-4 h-4 rounded bg-gray-200 dark:bg-gray-700 flex items-center justify-center font-bold text-xs hover:bg-green-200 hover:text-green-700">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('stat-total-items').textContent = totalItemsCount;
      document.getElementById('stat-out-stock').textContent = outOfStockCount;
    };

    window.updateStock = function(productId, sizeKey, delta) {
      const p = products.find(prod => prod.id === productId);
      if (p && p.sizes[sizeKey] !== undefined) {
        const currentVal = p.sizes[sizeKey];
        if (currentVal + delta >= 0) {
          p.sizes[sizeKey] += delta;
          saveProductsToLocalStorage();
        }
      }
    };

    window.handleImageUpload = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          base64ImageTemp = evt.target.result;
          document.getElementById('preview-img-src').src = base64ImageTemp;
          document.getElementById('image-preview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    };

    window.handleProductSubmit = function(e) {
      e.preventDefault();
      const id = document.getElementById('form-product-id').value;
      const name = document.getElementById('form-name').value;
      const category = document.getElementById('form-category').value;
      const price = parseFloat(document.getElementById('form-price').value) || 0;
      const colorsInput = document.getElementById('form-colors').value;
      const colors = colorsInput ? colorsInput.split(',').map(c => c.trim()) : ["Único"];

      const sizes = {
        XS: parseInt(document.getElementById('size-xs').value) || 0,
        S: parseInt(document.getElementById('size-s').value) || 0,
        M: parseInt(document.getElementById('size-m').value) || 0,
        L: parseInt(document.getElementById('size-l').value) || 0,
        XL: parseInt(document.getElementById('size-xl').value) || 0,
        Unique: parseInt(document.getElementById('size-unique').value) || 0
      };

      const existingProd = products.find(p => p.id === id);
      const image = base64ImageTemp || (existingProd ? existingProd.image : "https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=500&auto=format&fit=crop&q=60");

      if (id) {
        const index = products.findIndex(p => p.id === id);
        if (index !== -1) {
          products[index] = { id, name, category, price, colors, sizes, image };
        }
      } else {
        const newProduct = {
          id: 'prod-' + Date.now(),
          name,
          category,
          price,
          colors,
          sizes,
          image
        };
        products.push(newProduct);
      }

      saveProductsToLocalStorage();
      resetForm();
      switchAdminTab('stock');
    };

    window.editProduct = function(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      document.getElementById('form-product-id').value = p.id;
      document.getElementById('form-name').value = p.name;
      document.getElementById('form-category').value = p.category;
      document.getElementById('form-price').value = p.price;
      document.getElementById('form-colors').value = (p.colors || []).join(', ');
      
      document.getElementById('size-xs').value = p.sizes.XS || 0;
      document.getElementById('size-s').value = p.sizes.S || 0;
      document.getElementById('size-m').value = p.sizes.M || 0;
      document.getElementById('size-l').value = p.sizes.L || 0;
      document.getElementById('size-xl').value = p.sizes.XL || 0;
      document.getElementById('size-unique').value = p.sizes.Unique || 0;

      base64ImageTemp = p.image;
      document.getElementById('preview-img-src').src = p.image;
      document.getElementById('image-preview').classList.remove('hidden');

      document.getElementById('form-title').textContent = "Editar Prenda";
      switchAdminTab('add');
    };

    window.deleteProduct = function(id) {
      if (confirm("¿Estás seguro de que deseas eliminar esta prenda del inventario?")) {
        products = products.filter(p => p.id !== id);
        saveProductsToLocalStorage();
      }
    };

    window.resetForm = function() {
      document.getElementById('product-form').reset();
      document.getElementById('form-product-id').value = '';
      document.getElementById('image-preview').classList.add('hidden');
      base64ImageTemp = '';
      document.getElementById('form-title').textContent = "Agregar Nueva Prenda";
    };

    window.showToast = function(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    };

    // INICIALIZACIÓN DE VISTA
    window.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      setMode('public');
    });
  </script>
</body>
</html>
